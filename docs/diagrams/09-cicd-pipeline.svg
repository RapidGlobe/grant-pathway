<svg width="1600" height="780" viewBox="0 0 1600 780" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="780" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="58" fill="#1e293b"/>
  <text x="800" y="22" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="2">GRANT PATHWAY</text>
  <text x="800" y="44" text-anchor="middle" fill="white" font-size="20" font-weight="bold">CI / CD Pipeline  —  From Commit to Production</text>

  <!-- ════════════════════════════════════════════════════════
       SWIM LANE LABELS (left column)
  ════════════════════════════════════════════════════════ -->
  <!-- Lane backgrounds -->
  <rect x="0" y="70" width="1600" height="620" fill="#f8fafc"/>
  <!-- Developer lane -->
  <rect x="0" y="70" width="120" height="140" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="148" text-anchor="middle" fill="#64748b" font-size="11" font-weight="bold" transform="rotate(-90,60,148)">DEVELOPER</text>
  <!-- GitHub lane -->
  <rect x="0" y="210" width="120" height="100" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="268" text-anchor="middle" fill="#64748b" font-size="11" font-weight="bold" transform="rotate(-90,60,268)">GITHUB</text>
  <!-- CI lane -->
  <rect x="0" y="310" width="120" height="220" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="420" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="bold" transform="rotate(-90,60,420)">GITHUB ACTIONS  ·  CI</text>
  <!-- Gate lane -->
  <rect x="0" y="530" width="120" height="80" fill="#f0fdf4" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="578" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold" transform="rotate(-90,60,578)">GATE</text>
  <!-- Vercel lane -->
  <rect x="0" y="610" width="120" height="80" fill="#faf5ff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="658" text-anchor="middle" fill="#6d28d9" font-size="11" font-weight="bold" transform="rotate(-90,60,658)">VERCEL</text>

  <!-- ════════════════════════════════════════════════════════
       STAGE 1: DEVELOPER
  ════════════════════════════════════════════════════════ -->
  <!-- Code change box -->
  <rect x="140" y="84" width="200" height="112" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="140" y="84" width="200" height="28" rx="8" fill="#374151"/>
  <rect x="140" y="98" width="200" height="14" fill="#374151"/>
  <text x="240" y="102" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Code Change</text>
  <text x="240" y="130" text-anchor="middle" fill="#475569" font-size="10">Edit source files</text>
  <text x="240" y="146" text-anchor="middle" fill="#475569" font-size="10">Pre-commit hooks run</text>
  <text x="240" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">(lint-staged · Husky)</text>
  <text x="240" y="178" text-anchor="middle" fill="#94a3b8" font-size="9">Prettier + ESLint on staged</text>

  <!-- Arrow: code change → push -->
  <line x1="340" y1="140" x2="390" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Push box -->
  <rect x="390" y="84" width="200" height="112" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="390" y="84" width="200" height="28" rx="8" fill="#374151"/>
  <rect x="390" y="98" width="200" height="14" fill="#374151"/>
  <text x="490" y="102" text-anchor="middle" fill="white" font-size="11" font-weight="bold">git push origin master</text>
  <text x="490" y="130" text-anchor="middle" fill="#475569" font-size="10">Or: open Pull Request</text>
  <text x="490" y="146" text-anchor="middle" fill="#475569" font-size="10">Branch protection enforced</text>
  <text x="490" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">strict: true — must be current</text>
  <text x="490" y="178" text-anchor="middle" fill="#94a3b8" font-size="9">Force-push and delete blocked</text>

  <!-- Arrow: push → GitHub -->
  <line x1="490" y1="196" x2="490" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════════
       STAGE 2: GITHUB
  ════════════════════════════════════════════════════════ -->
  <rect x="390" y="222" width="200" height="74" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="390" y="222" width="200" height="28" rx="8" fill="#24292f"/>
  <rect x="390" y="236" width="200" height="14" fill="#24292f"/>
  <text x="490" y="240" text-anchor="middle" fill="white" font-size="11" font-weight="bold">GitHub</text>
  <text x="490" y="264" text-anchor="middle" fill="#475569" font-size="10">Triggers workflow:</text>
  <text x="490" y="280" text-anchor="middle" fill="#475569" font-size="10">on: [push, pull_request]</text>

  <!-- Arrow: GitHub → CI (fans out to 4 jobs) -->
  <line x1="490" y1="296" x2="490" y2="318" stroke="#24292f" stroke-width="2" marker-end="url(#arr)"/>
  <!-- fan out lines -->
  <line x1="310" y1="318" x2="1290" y2="318" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="310" y1="318" x2="310" y2="336" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="318" x2="560" y2="336" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="920" y1="318" x2="920" y2="336" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1290" y1="318" x2="1290" y2="336" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- "runs in parallel" label -->
  <text x="800" y="314" text-anchor="middle" fill="#94a3b8" font-size="9" font-style="italic">4 jobs run in parallel</text>

  <!-- ════════════════════════════════════════════════════════
       STAGE 3: CI JOBS (4 parallel)
  ════════════════════════════════════════════════════════ -->

  <!-- Job 1: lint-and-typecheck -->
  <rect x="140" y="336" width="340" height="180" rx="8" fill="white" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="140" y="336" width="340" height="30" rx="8" fill="#2563eb"/>
  <rect x="140" y="352" width="340" height="14" fill="#2563eb"/>
  <text x="310" y="356" text-anchor="middle" fill="white" font-size="12" font-weight="bold">lint-and-typecheck</text>
  <text x="156" y="384" fill="#475569" font-size="10">ubuntu-latest  ·  Node 20</text>
  <text x="156" y="400" fill="#475569" font-size="10">npm ci</text>
  <text x="156" y="416" fill="#475569" font-size="10">npx tsc --noEmit</text>
  <text x="156" y="432" fill="#475569" font-size="10">npx eslint . --max-warnings 0</text>
  <text x="156" y="456" fill="#94a3b8" font-size="9" font-style="italic">Strict TypeScript — no implicit any</text>
  <text x="156" y="472" fill="#94a3b8" font-size="9" font-style="italic">Zero ESLint warnings tolerated</text>
  <text x="156" y="495" text-anchor="start" fill="#059669" font-size="10" font-weight="bold">✓  REQUIRED to merge</text>

  <!-- Job 2: test -->
  <rect x="500" y="336" width="340" height="180" rx="8" fill="white" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="500" y="336" width="340" height="30" rx="8" fill="#2563eb"/>
  <rect x="500" y="352" width="340" height="14" fill="#2563eb"/>
  <text x="670" y="356" text-anchor="middle" fill="white" font-size="12" font-weight="bold">test</text>
  <text x="516" y="384" fill="#475569" font-size="10">ubuntu-latest  ·  Node 20</text>
  <text x="516" y="400" fill="#475569" font-size="10">npm ci</text>
  <text x="516" y="416" fill="#475569" font-size="10">npx vitest run</text>
  <text x="516" y="432" fill="#94a3b8" font-size="9" font-style="italic">22 tests across 3 suites:</text>
  <text x="516" y="448" fill="#94a3b8" font-size="9" font-style="italic">  prompts.test.ts — XML fencing constants</text>
  <text x="516" y="464" fill="#94a3b8" font-size="9" font-style="italic">  ai-cap.test.ts — cap/threshold logic</text>
  <text x="516" y="480" fill="#94a3b8" font-size="9" font-style="italic">  upload-idor.test.ts — path-prefix guard</text>
  <text x="516" y="495" text-anchor="start" fill="#059669" font-size="10" font-weight="bold">✓  REQUIRED to merge</text>

  <!-- Job 3: audit -->
  <rect x="860" y="336" width="340" height="180" rx="8" fill="white" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="860" y="336" width="340" height="30" rx="8" fill="#2563eb"/>
  <rect x="860" y="352" width="340" height="14" fill="#2563eb"/>
  <text x="1030" y="356" text-anchor="middle" fill="white" font-size="12" font-weight="bold">audit</text>
  <text x="876" y="384" fill="#475569" font-size="10">ubuntu-latest  ·  Node 20</text>
  <text x="876" y="400" fill="#475569" font-size="10">npm ci</text>
  <text x="876" y="416" fill="#475569" font-size="10">npm audit --audit-level=high</text>
  <text x="876" y="440" fill="#94a3b8" font-size="9" font-style="italic">Blocks on any high or critical</text>
  <text x="876" y="456" fill="#94a3b8" font-size="9" font-style="italic">CVE in dependencies</text>
  <text x="876" y="472" fill="#94a3b8" font-size="9" font-style="italic">Dependabot PRs kept current</text>
  <text x="876" y="495" text-anchor="start" fill="#059669" font-size="10" font-weight="bold">✓  REQUIRED to merge</text>

  <!-- Job 4: validate-migrations -->
  <rect x="1220" y="336" width="340" height="180" rx="8" fill="white" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="1220" y="336" width="340" height="30" rx="8" fill="#2563eb"/>
  <rect x="1220" y="352" width="340" height="14" fill="#2563eb"/>
  <text x="1390" y="356" text-anchor="middle" fill="white" font-size="12" font-weight="bold">validate-migrations</text>
  <text x="1236" y="384" fill="#475569" font-size="10">ubuntu-latest  ·  Node 20</text>
  <text x="1236" y="400" fill="#475569" font-size="10">npx supabase db start</text>
  <text x="1236" y="416" fill="#475569" font-size="10">npx supabase db reset --local</text>
  <text x="1236" y="432" fill="#475569" font-size="10">npx supabase db stop</text>
  <text x="1236" y="456" fill="#94a3b8" font-size="9" font-style="italic">Proves schema applies from empty</text>
  <text x="1236" y="472" fill="#94a3b8" font-size="9" font-style="italic">on every push — no broken SQL</text>
  <text x="1236" y="495" text-anchor="start" fill="#059669" font-size="10" font-weight="bold">✓  REQUIRED to merge</text>

  <!-- ════════════════════════════════════════════════════════
       STAGE 4: BRANCH PROTECTION GATE
  ════════════════════════════════════════════════════════ -->
  <!-- Converge lines to gate -->
  <line x1="310" y1="516" x2="310" y2="542" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="670" y1="516" x2="670" y2="542" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="1030" y1="516" x2="1030" y2="542" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="1390" y1="516" x2="1390" y2="542" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="310" y1="542" x2="1390" y2="542" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="800" y1="542" x2="800" y2="558" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="450" y="558" width="700" height="60" rx="8" fill="white" stroke="#86efac" stroke-width="2"/>
  <rect x="450" y="558" width="700" height="28" rx="8" fill="#059669"/>
  <rect x="450" y="572" width="700" height="14" fill="#059669"/>
  <text x="800" y="576" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Branch Protection Gate  ·  All 4 checks must pass</text>
  <text x="800" y="604" text-anchor="middle" fill="#475569" font-size="10">lint-and-typecheck  ✓     test  ✓     audit  ✓     validate-migrations  ✓     →  Merge permitted</text>

  <!-- Fail path -->
  <line x1="450" y1="590" x2="350" y2="590" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>
  <rect x="140" y="560" width="206" height="58" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="243" y="584" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="bold">Any check fails</text>
  <text x="243" y="600" text-anchor="middle" fill="#991b1b" font-size="10">Merge blocked</text>
  <text x="243" y="614" text-anchor="middle" fill="#991b1b" font-size="10">Developer notified</text>

  <!-- Arrow: gate → Vercel -->
  <line x1="800" y1="618" x2="800" y2="636" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════════
       STAGE 5: VERCEL DEPLOY
  ════════════════════════════════════════════════════════ -->
  <rect x="350" y="636" width="420" height="72" rx="8" fill="white" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="350" y="636" width="420" height="28" rx="8" fill="#6d28d9"/>
  <rect x="350" y="650" width="420" height="14" fill="#6d28d9"/>
  <text x="560" y="654" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Vercel Build  &amp;  Deploy</text>
  <text x="560" y="680" text-anchor="middle" fill="#475569" font-size="10">Next.js build  →  Edge deployment  →  grantpathway.org.uk</text>
  <text x="560" y="696" text-anchor="middle" fill="#94a3b8" font-size="10">Env vars injected from Vercel project settings  ·  Sentry source maps uploaded</text>

  <!-- Arrow: Vercel → Live -->
  <line x1="770" y1="672" x2="830" y2="672" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="830" y="636" width="260" height="72" rx="8" fill="#4c1d95"/>
  <text x="960" y="666" text-anchor="middle" fill="white" font-size="13" font-weight="bold">&#127881;  LIVE</text>
  <text x="960" y="686" text-anchor="middle" fill="#c4b5fd" font-size="10">grantpathway.org.uk</text>
  <text x="960" y="700" text-anchor="middle" fill="#c4b5fd" font-size="10">Production · Vercel Pro</text>

  <!-- ════════════════════════════════════════════════════════
       NOTES PANEL (bottom)
  ════════════════════════════════════════════════════════ -->
  <rect x="140" y="726" width="1320" height="38" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="156" y="741" fill="#475569" font-size="10" font-weight="bold">Notes: </text>
  <text x="210" y="741" fill="#475569" font-size="10">Dependabot monitors all npm dependencies weekly and raises PRs automatically.  ·  </text>
  <text x="210" y="755" fill="#475569" font-size="10">All CI jobs run on ubuntu-latest with Node 20 using npm ci for reproducible installs.  Branch protection on master requires GitHub Pro (activated 2026-06-29).</text>

  <!-- Footer -->
  <line x1="0" y1="762" x2="1600" y2="762" stroke="#e2e8f0" stroke-width="1"/>
  <text x="800" y="775" text-anchor="middle" fill="#94a3b8" font-size="10">Grant Pathway  ·  RapidGlobe Ltd  (Reg. 05615649)  ·  Diagram v1.0  ·  2026-06-29</text>
</svg>
