<svg width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="1400" height="58" fill="#1e293b"/>
  <text x="700" y="22" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="2">GRANT PATHWAY</text>
  <text x="700" y="44" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Security Architecture  —  Defence in Depth</text>

  <!-- ── LAYER 1: GitHub / CI (outermost) ── -->
  <rect x="30" y="72" width="1340" height="880" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <!-- Layer label — top-left badge -->
  <rect x="30" y="72" width="300" height="34" rx="6" fill="#374151"/>
  <text x="44" y="94" fill="white" font-size="12" font-weight="bold">LAYER 1  ·  Source Control &amp; CI Gates</text>

  <!-- GitHub + CI items -->
  <rect x="50" y="118" width="380" height="100" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="50" y="118" width="380" height="28" rx="6" fill="#24292f"/>
  <rect x="50" y="132" width="380" height="14" fill="#24292f"/>
  <text x="240" y="136" text-anchor="middle" fill="white" font-size="11" font-weight="bold">GitHub Branch Protection — master</text>
  <text x="66" y="162" fill="#475569" font-size="10">• Force-push and branch deletion blocked</text>
  <text x="66" y="178" fill="#475569" font-size="10">• strict: true — branch must be up to date before merge</text>
  <text x="66" y="194" fill="#475569" font-size="10">• All 4 CI status checks required to pass</text>

  <rect x="450" y="118" width="200" height="100" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="450" y="118" width="200" height="28" rx="6" fill="#24292f"/>
  <rect x="450" y="132" width="200" height="14" fill="#24292f"/>
  <text x="550" y="136" text-anchor="middle" fill="white" font-size="11" font-weight="bold">lint-and-typecheck</text>
  <text x="466" y="162" fill="#475569" font-size="10">ESLint strict rules</text>
  <text x="466" y="178" fill="#475569" font-size="10">TypeScript strict mode</text>
  <text x="466" y="194" fill="#475569" font-size="10">No implicit any</text>

  <rect x="665" y="118" width="200" height="100" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="665" y="118" width="200" height="28" rx="6" fill="#24292f"/>
  <rect x="665" y="132" width="200" height="14" fill="#24292f"/>
  <text x="765" y="136" text-anchor="middle" fill="white" font-size="11" font-weight="bold">test (Vitest)</text>
  <text x="681" y="162" fill="#475569" font-size="10">22 unit tests</text>
  <text x="681" y="178" fill="#475569" font-size="10">IDOR path-prefix guard</text>
  <text x="681" y="194" fill="#475569" font-size="10">Cap / threshold logic</text>

  <rect x="880" y="118" width="200" height="100" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="880" y="118" width="200" height="28" rx="6" fill="#24292f"/>
  <rect x="880" y="132" width="200" height="14" fill="#24292f"/>
  <text x="980" y="136" text-anchor="middle" fill="white" font-size="11" font-weight="bold">npm audit</text>
  <text x="896" y="162" fill="#475569" font-size="10">Blocks on high/critical</text>
  <text x="896" y="178" fill="#475569" font-size="10">Every push and PR</text>
  <text x="896" y="194" fill="#475569" font-size="10">Dependabot PRs active</text>

  <rect x="1095" y="118" width="255" height="100" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="1095" y="118" width="255" height="28" rx="6" fill="#24292f"/>
  <rect x="1095" y="132" width="255" height="14" fill="#24292f"/>
  <text x="1222" y="136" text-anchor="middle" fill="white" font-size="11" font-weight="bold">validate-migrations</text>
  <text x="1111" y="162" fill="#475569" font-size="10">Supabase CLI db reset</text>
  <text x="1111" y="178" fill="#475569" font-size="10">Schema from empty on CI</text>
  <text x="1111" y="194" fill="#475569" font-size="10">Every push and PR</text>

  <!-- ── LAYER 2: Network / Vercel ── -->
  <rect x="60" y="238" width="1280" height="716" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="60" y="238" width="280" height="30" rx="6" fill="#1d4ed8"/>
  <text x="74" y="258" fill="white" font-size="12" font-weight="bold">LAYER 2  ·  Network &amp; Transport</text>

  <rect x="80" y="280" width="560" height="90" rx="6" fill="white" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="80" y="280" width="560" height="28" rx="6" fill="#2563eb"/>
  <rect x="80" y="294" width="560" height="14" fill="#2563eb"/>
  <text x="360" y="298" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Vercel Edge Network</text>
  <text x="96" y="324" fill="#475569" font-size="10">• TLS 1.3 enforced end-to-end  ·  HSTS max-age=31536000 includeSubDomains</text>
  <text x="96" y="340" fill="#475569" font-size="10">• DDoS protection and bot mitigation at edge  ·  Automatic HTTPS certificate renewal</text>
  <text x="96" y="356" fill="#475569" font-size="10">• X-Frame-Options: DENY  ·  X-Content-Type-Options: nosniff  ·  Referrer-Policy: strict-origin</text>

  <rect x="660" y="280" width="660" height="90" rx="6" fill="white" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="660" y="280" width="660" height="28" rx="6" fill="#2563eb"/>
  <rect x="660" y="294" width="660" height="14" fill="#2563eb"/>
  <text x="990" y="298" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Content Security Policy  (per-request nonce)</text>
  <text x="676" y="324" fill="#475569" font-size="10">• script-src 'self' 'nonce-{random}' — no unsafe-inline on scripts</text>
  <text x="676" y="340" fill="#475569" font-size="10">• Nonce generated in middleware.ts via crypto.randomUUID() → base64 on every request</text>
  <text x="676" y="356" fill="#475569" font-size="10">• frame-ancestors 'none'  ·  connect-src scoped to Supabase + Sentry only</text>

  <!-- ── LAYER 3: Application / Middleware ── -->
  <rect x="90" y="390" width="1220" height="548" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <rect x="90" y="390" width="280" height="30" rx="6" fill="#16a34a"/>
  <text x="104" y="410" fill="white" font-size="12" font-weight="bold">LAYER 3  ·  Application Middleware</text>

  <rect x="110" y="432" width="370" height="130" rx="6" fill="white" stroke="#86efac" stroke-width="1.5"/>
  <rect x="110" y="432" width="370" height="28" rx="6" fill="#059669"/>
  <rect x="110" y="446" width="370" height="14" fill="#059669"/>
  <text x="295" y="450" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Authentication Gate</text>
  <text x="126" y="476" fill="#475569" font-size="10">• Supabase SSR getUser() on every request</text>
  <text x="126" y="492" fill="#475569" font-size="10">• Unauthenticated → redirect to /login</text>
  <text x="126" y="508" fill="#475569" font-size="10">• Session cookie validated server-side</text>
  <text x="126" y="524" fill="#475569" font-size="10">• Email must be confirmed before access</text>
  <text x="126" y="540" fill="#475569" font-size="10">• Password: 12 chars, leaked-pw check</text>

  <rect x="500" y="432" width="370" height="130" rx="6" fill="white" stroke="#86efac" stroke-width="1.5"/>
  <rect x="500" y="432" width="370" height="28" rx="6" fill="#059669"/>
  <rect x="500" y="446" width="370" height="14" fill="#059669"/>
  <text x="685" y="450" text-anchor="middle" fill="white" font-size="11" font-weight="bold">AI Rate &amp; Spend Controls</text>
  <text x="516" y="476" fill="#475569" font-size="10">• Upstash Redis burst rate-limit per user</text>
  <text x="516" y="492" fill="#475569" font-size="10">• Monthly cap: 50 requests (soft warn at 40)</text>
  <text x="516" y="508" fill="#475569" font-size="10">• Cap fail-closed — DB error → 500, not bypass</text>
  <text x="516" y="524" fill="#475569" font-size="10">• Postgres advisory lock (TOCTOU closed)</text>
  <text x="516" y="540" fill="#475569" font-size="10">• AI_ENABLED kill-switch env flag</text>

  <rect x="890" y="432" width="390" height="130" rx="6" fill="white" stroke="#86efac" stroke-width="1.5"/>
  <rect x="890" y="432" width="390" height="28" rx="6" fill="#059669"/>
  <rect x="890" y="446" width="390" height="14" fill="#059669"/>
  <text x="1085" y="450" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Input Validation &amp; Secrets</text>
  <text x="906" y="476" fill="#475569" font-size="10">• Zod env validation at startup (lib/env.ts)</text>
  <text x="906" y="492" fill="#475569" font-size="10">• Zod safeParse on all LLM JSON responses</text>
  <text x="906" y="508" fill="#475569" font-size="10">• XML-tag fencing on all AI prompt inputs</text>
  <text x="906" y="524" fill="#475569" font-size="10">• Resend preflight — 503 if key missing</text>
  <text x="906" y="540" fill="#475569" font-size="10">• 60 s AbortSignal on all Bedrock calls</text>

  <!-- ── LAYER 4: Data Access ── -->
  <rect x="120" y="582" width="1160" height="340" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="120" y="582" width="260" height="30" rx="6" fill="#7c3aed"/>
  <text x="134" y="602" fill="white" font-size="12" font-weight="bold">LAYER 4  ·  Data Access Controls</text>

  <rect x="140" y="624" width="350" height="150" rx="6" fill="white" stroke="#e9d5ff" stroke-width="1.5"/>
  <rect x="140" y="624" width="350" height="28" rx="6" fill="#6d28d9"/>
  <rect x="140" y="638" width="350" height="14" fill="#6d28d9"/>
  <text x="315" y="642" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Supabase Row-Level Security</text>
  <text x="156" y="668" fill="#475569" font-size="10">• All user-scoped tables enforce RLS</text>
  <text x="156" y="684" fill="#475569" font-size="10">• (select auth.uid()) — once per statement</text>
  <text x="156" y="700" fill="#475569" font-size="10">• WITH CHECK on all UPDATE policies</text>
  <text x="156" y="716" fill="#475569" font-size="10">• funders: SELECT only for auth users</text>
  <text x="156" y="732" fill="#475569" font-size="10">• Service role used only in cron jobs</text>
  <text x="156" y="760" fill="#94a3b8" font-size="9" font-style="italic">Prevents cross-user data access at DB layer</text>

  <rect x="510" y="624" width="350" height="150" rx="6" fill="white" stroke="#e9d5ff" stroke-width="1.5"/>
  <rect x="510" y="624" width="350" height="28" rx="6" fill="#6d28d9"/>
  <rect x="510" y="638" width="350" height="14" fill="#6d28d9"/>
  <text x="685" y="642" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Application-Level IDOR Checks</text>
  <text x="526" y="668" fill="#475569" font-size="10">• Upload path prefix: must start with user.id_</text>
  <text x="526" y="684" fill="#475569" font-size="10">• applicationId ownership verified before read</text>
  <text x="526" y="700" fill="#475569" font-size="10">• approve/reopen via RPC — user_id checked</text>
  <text x="526" y="716" fill="#475569" font-size="10">• 403 returned on ownership mismatch</text>
  <text x="526" y="732" fill="#475569" font-size="10">• All actions server-side (no client trust)</text>
  <text x="526" y="760" fill="#94a3b8" font-size="9" font-style="italic">Closes cross-user file-read IDOR (Alan Knox Critical)</text>

  <rect x="880" y="624" width="380" height="150" rx="6" fill="white" stroke="#e9d5ff" stroke-width="1.5"/>
  <rect x="880" y="624" width="380" height="28" rx="6" fill="#6d28d9"/>
  <rect x="880" y="638" width="380" height="14" fill="#6d28d9"/>
  <text x="1070" y="642" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Least-Privilege Keys &amp; Data Residency</text>
  <text x="896" y="668" fill="#475569" font-size="10">• AWS IAM: single InvokeModel permission only</text>
  <text x="896" y="684" fill="#475569" font-size="10">• Resend: Sending access — grantpathway.org.uk only</text>
  <text x="896" y="700" fill="#475569" font-size="10">• Supabase: London (eu-west-2) — GDPR/UK GDPR</text>
  <text x="896" y="716" fill="#475569" font-size="10">• AWS Bedrock: eu-west-2 — zero retention, no training</text>
  <text x="896" y="732" fill="#475569" font-size="10">• Sentry: EU region — PII scrubbed before send</text>
  <text x="896" y="760" fill="#94a3b8" font-size="9" font-style="italic">All personal data stays in UK / EU at rest</text>

  <!-- Footer -->
  <line x1="0" y1="980" x2="1400" y2="980" stroke="#e2e8f0" stroke-width="1"/>
  <text x="700" y="994" text-anchor="middle" fill="#94a3b8" font-size="10">Grant Pathway  ·  RapidGlobe Ltd  (Reg. 05615649)  ·  Diagram v1.0  ·  2026-06-29  ·  Based on Alan Knox independent security audit findings</text>
</svg>
