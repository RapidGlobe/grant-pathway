name: Schema Drift Check

# Automated version of regression-test-plan.md RT-00. Checks that every
# tracked migration and every AI-cap/approve-reopen RPC function actually
# exists on the real, hosted dev and prod databases -- not just that the
# tracked migration files apply cleanly to an empty local database (which
# is all validate-migrations in ci.yml proves).
#
# Added 2026-07-01 after grant-pathway-dev and grant-pathway-prod were
# found to have been silently missing this exact schema for weeks -- the
# gap was invisible from inside the app and from CI. See CHANGELOG.md,
# 2026-07-01, for the full story.
#
# SCHEDULED RUNS CHECK dev ONLY, UNTIL P5.4 PROVISIONS PRODUCTION.
# Decision: WJ, 2026-08-03. grant-pathway-prod does not have Phase 6's
# migrations, so the prod leg failed every scheduled run from at least
# 2026-07-24 -- and a check that is expected to be red cannot signal
# anything else, so a genuine unrelated drift on prod would have looked
# identical to the known failure. The same masking that took the audit's
# M2 finding to split security-audit.yml out of ci.yml. Skipping the prod
# leg restores dev drift as a live signal; it does not make prod safer,
# and it is safe to skip only because this workflow is NOT a required
# status check on master (those are lint-and-typecheck, test and
# validate-migrations) -- so nothing is left waiting on a check that
# never reports.
#
# TO RE-ENABLE PROD: change the `environments` default below to
# '["dev","prod"]'. That is an explicit, tasked step in P5.4, and P5.4's
# exit test requires it -- a green dev-only run does not discharge it.
# Meanwhile prod can be checked on demand from the Actions tab without
# editing this file, which is what P5.4 will want while applying
# migrations.

on:
  schedule:
    - cron: '0 7 * * *' # daily, 07:00 UTC
  workflow_dispatch:
    inputs:
      environments:
        description: 'Databases to check (scheduled runs always use the default)'
        type: choice
        default: '["dev"]'
        options:
          - '["dev"]'
          - '["dev","prod"]'
          - '["prod"]'

jobs:
  check-schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs supply no inputs, so they fall through to ["dev"].
        environment: ${{ fromJSON(github.event.inputs.environments || '["dev"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Select database URL for this environment
        id: db
        run: |
          if [ "${{ matrix.environment }}" = "dev" ]; then
            echo "url=${{ secrets.SUPABASE_DEV_DB_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ secrets.SUPABASE_PROD_DB_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check required RPC functions exist
        env:
          PGCONNECT_TIMEOUT: '10'
        run: |
          MISSING=$(psql "${{ steps.db.outputs.url }}" -tAc "
            select string_agg(fn, ', ') from (
              select unnest(array[
                'reserve_ai_slot',
                'update_ai_slot_token_count',
                'cancel_ai_slot',
                'approve_application',
                'reopen_application'
              ]) as fn
            ) required
            where fn not in (select proname from pg_proc where pronamespace = 'public'::regnamespace);
          ")
          if [ -n "$MISSING" ]; then
            echo "::error::${{ matrix.environment }} is missing required RPC function(s): $MISSING"
            exit 1
          fi
          echo "✓ ${{ matrix.environment }}: all 5 required RPC functions present"

      - name: Check migration tracking matches local files
        run: |
          LOCAL_COUNT=$(ls supabase/migrations/*.sql | wc -l)
          REMOTE_COUNT=$(psql "${{ steps.db.outputs.url }}" -tAc "select count(*) from supabase_migrations.schema_migrations;")
          if [ "$LOCAL_COUNT" != "$REMOTE_COUNT" ]; then
            echo "::error::${{ matrix.environment }} migration count mismatch: $LOCAL_COUNT tracked locally, $REMOTE_COUNT recorded as applied on the remote. Run 'supabase migration list --linked' against this project to see exactly which versions are missing."
            exit 1
          fi
          echo "✓ ${{ matrix.environment }}: $REMOTE_COUNT/$LOCAL_COUNT migrations recorded as applied"
