name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # The dependency-vulnerability scan formerly lived here as an `audit` job.
  # Moved to security-audit.yml on 2026-07-29 (Opus audit M2): it was red
  # continuously from ~2026-07-25 on a devDependency advisory with no available
  # fix, which turned this whole workflow red on every push and made a genuine
  # failure in the jobs below indistinguishable from known, accepted noise.
  # It still runs and still reports — it just no longer gates.

  validate-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply migrations from scratch
        run: supabase db start && supabase db reset --local
      - name: Stop Supabase
        if: always()
        run: supabase stop
